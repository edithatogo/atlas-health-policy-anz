  "conductor/completion.md",
  "conductor/tracks.md",
  "docs/ECOSYSTEM_REUSE.md",
  "docs/COMPARISON_ASSURANCE.md",
  "agents/catalog.md",
  "skills/catalog.md",
  "workflows/catalog.md",
]

required_manifests = [
  ".context/ecosystem.toml",
  ".context/dependencies.toml",
  ".context/comparison.toml",
  ".context/frameworks.toml",
  ".context/autonomy.toml",
  "conductor/registry.toml",
]

