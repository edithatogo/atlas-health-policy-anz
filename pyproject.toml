[build-system]
requires = ["uv_build>=0.11.29,<0.13.0"]
build-backend = "uv_build"

[project]
name = "australian-health-policy-atlas"
version = "0.1.0"
description = "Evidence-first computational comparison of Australian health policies, procedures and guidelines"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
authors = [{ name = "edithatogo" }]
dependencies = []

[project.optional-dependencies]
nlp = ["spacy>=3.8.16,<4"]

[project.scripts]
au-health-policy-atlas = "australian_health_policy_atlas.cli:main"

[dependency-groups]
test = [
  "jsonschema[format-nongpl]>=4.25,<5",
  "packaging>=26,<27",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "coverage[toml]>=7.10.6,<8",
  "pytest-mock>=3.15.1,<4",
  "pytest-socket>=0.8.1,<1",
  "pytest-subprocess>=1.6,<2",
  "pytest-httpserver>=1.1.5,<2",
  "inline-snapshot>=0.35.4,<0.36",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
]
test-goblin = [
  { include-group = "test" },
  "hypothesis>=6.164,<7",
  "mutmut>=3.5,<4",
  "pytest-gremlins>=1.9,<2",
  "pytest-picked>=0.5,<1",
  "pytest-randomly>=4,<5",
  "pytest-testmon>=2.2,<3",
]
test-performance = [
  { include-group = "test-goblin" },
  "pytest-benchmark>=5.3,<6",
]
typing = [
  "basedpyright>=1.39.9,<2",
  "ruff>=0.16.1,<0.17",
  "ty>=0.0.18,<1",
  "types-jsonschema>=4.25,<5",
]
profiling = ["scalene>=2.3,<3"]
security = [
  "cyclonedx-bom>=7.3,<8",
  "pip-audit>=2.10,<3",
  "zizmor>=1.13,<2",
]
publication = ["huggingface_hub>=0.28,<2"]
dev = [
  { include-group = "test-goblin" },
  { include-group = "typing" },
  { include-group = "test-performance" },
  { include-group = "profiling" },
  { include-group = "security" },
]

[tool.uv]
package = true
default-groups = ["test-goblin", "typing"]

[tool.uv.dependency-groups]
test = { requires-python = ">=3.14,<3.15" }
test-goblin = { requires-python = ">=3.14,<3.15" }
test-performance = { requires-python = ">=3.14,<3.15" }
typing = { requires-python = ">=3.14,<3.15" }
profiling = { requires-python = ">=3.14,<3.15" }
security = { requires-python = ">=3.14,<3.15" }
publication = { requires-python = ">=3.14,<3.15" }
dev = { requires-python = ">=3.14,<3.15" }

[tool.pytest.ini_options]
addopts = ["--disable-plugin-autoload", "-ra"]
strict = true
filterwarnings = ["error"]
junit_family = "xunit2"
minversion = "9.1"
testpaths = ["tests"]
markers = [
  "unit: isolated deterministic logic",
  "integration: component and adapter boundaries",
  "e2e: complete bounded workflows",
  "smoke: critical-path checks",
  "property: generative invariants",
  "metamorphic: controlled transformation invariants",
  "contract: versioned provider/consumer contracts",
  "simulation: deterministic state-machine/event tests",
  "edge: malformed and failure-mode cases",
  "model: live model qualification only",
  "benchmark: bounded CPU performance measurement, not clinical validation",
  "quality: quality-toolchain contracts",
]
timeout = 30

[tool.coverage.run]
branch = true
source = ["australian_health_policy_atlas"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_covered = false

[tool.basedpyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
failOnWarnings = true
reportMissingTypeStubs = "error"
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
enableTypeIgnoreComments = false

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "scripts", "tests"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ruff]
unsafe-fixes = false
force-exclude = true
target-version = "py314"
line-length = 88
src = ["src", "scripts", "tests"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 6
max-statements = 50

[tool.pytest-gremlins]
paths = ["src/australian_health_policy_atlas/state_machine.py", "src/australian_health_policy_atlas/verification.py"]
operators = ["comparison", "boundary", "boolean", "arithmetic", "return"]
workers = 2
cache = false
report = ["console", "json"]
max_pardons = 0

[tool.mutmut]
source_paths = ["src/australian_health_policy_atlas/state_machine.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_state_machine.py"]
mutate_only_covered_lines = true
use_git_change_detection = false
