name: Manual bounded Queensland policy original-document packet
# Initial capture and dependency-only handoff are complete. No automatic reruns.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qld-source-packet-20260909
  cancel-in-progress: false
jobs:
  capture:
    name: Capture and verify the explicitly selected public policy packet
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/source-packet/qld-energy-health-20260909'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Required only to commit allowlisted source originals and receipts to this branch.
      contents: write
    steps:
      - name: Check out source-packet branch without persistent credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Offline transport negative controls
        run: python -m unittest discover -s source-packets/queensland-energy-health-20260909 -p 'test_capture.py' -v
      - name: Capture allowlisted original documents
        run: python source-packets/queensland-energy-health-20260909/capture.py
      - name: Retain packet and failure receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: qld-original-policy-packet-20260909
          path: source-packets/queensland-energy-health-20260909/
          retention-days: 30
          if-no-files-found: error
      - name: Commit only originals and capture receipts to the source branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_BRANCH" = "source-packet/qld-energy-health-20260909"
          git add -- source-packets/queensland-energy-health-20260909/originals source-packets/queensland-energy-health-20260909/capture-manifest.json source-packets/queensland-energy-health-20260909/capture-manifest.sha256
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in source-packets/queensland-energy-health-20260909/*) ;; *) exit 1 ;; esac
          done
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: capture original Queensland policy documents with fixity receipts'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$SOURCE_BRANCH"
