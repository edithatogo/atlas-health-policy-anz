name: Temporary read-only Bronze development snapshot

on:
  push:
    branches: [feat/bronze-packet-verification]
    paths: [.github/workflows/bronze-development-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bronze-development-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Export exact public source and locked test environment
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/feat/bronze-packet-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned runtime manager
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Restore declared locked test environment
        run: |
          uv python install 3.14.6
          uv sync --python 3.14.6 --group dev --group publication --extra nlp --locked
      - name: Export tracked source, Git history and interpreter without credentials or caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/atlas-development
          git bundle create /tmp/atlas-development/repository.bundle --all
          git archive --format=tar HEAD | gzip > /tmp/atlas-development/source.tar.gz
          interpreter=$(uv python find 3.14.6)
          runtime=$(dirname "$(dirname "$interpreter")")
          tar -czf /tmp/atlas-development/runtime.tar.gz -C "$runtime" .
          tar -czf /tmp/atlas-development/site-packages.tar.gz -C .venv/lib/python3.14/site-packages .
          git rev-parse HEAD > /tmp/atlas-development/commit.txt
          sha256sum pyproject.toml uv.lock > /tmp/atlas-development/contracts.sha256
          (cd /tmp/atlas-development && sha256sum repository.bundle source.tar.gz runtime.tar.gz site-packages.tar.gz commit.txt contracts.sha256 > SHA256SUMS)
      - name: Retain short-lived development inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bronze-development-snapshot
          path: /tmp/atlas-development/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
