name: Temporary read-only Bronze development snapshot

on:
  push:
    branches: [feat/bronze-packet-verification]
    paths: [.github/workflows/bronze-development-snapshot.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bronze-development-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Export exact managed interpreter
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/feat/bronze-packet-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source with no persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned runtime manager
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Export the resolved standalone interpreter, not a virtualenv symlink
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.14.6
          interpreter=$(readlink -f "$(uv python find 3.14.6)")
          runtime=$(dirname "$(dirname "$interpreter")")
          mkdir -p /tmp/atlas-runtime
          tar -czf /tmp/atlas-runtime/runtime.tar.gz -C "$runtime" .
          "$interpreter" --version > /tmp/atlas-runtime/version.txt
          sha256sum pyproject.toml uv.lock > /tmp/atlas-runtime/contracts.sha256
          (cd /tmp/atlas-runtime && sha256sum runtime.tar.gz version.txt contracts.sha256 > SHA256SUMS)
      - name: Retain short-lived runtime inputs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bronze-managed-runtime
          path: /tmp/atlas-runtime/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
