name: Strict Python Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strict-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Strict ${{ matrix.checker }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        checker: [ruff, format, basedpyright, ty]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install exact runtime and locked analysis dependencies
        run: |
          uv python install 3.14.6
          uv sync --python 3.14.6 --group dev --group publication --extra nlp --locked
      - name: Enforce strict check without baselines or warning suppression
        env:
          ATLAS_CHECKER: ${{ matrix.checker }}
        run: uv run --no-sync python scripts/strict_quality.py "$ATLAS_CHECKER"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: strict-${{ matrix.checker }}-receipt
          path: build/quality/
          if-no-files-found: warn
          retention-days: 30
