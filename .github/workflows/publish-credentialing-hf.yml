name: Credentialing Policy Atlas Hugging Face publication

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Hugging Face dataset repository
        required: true
        default: edithatogo/credentialing-policy-atlas
        type: string
      publish:
        description: Publish after building and validating the public-safe package
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: credentialing-hf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build public-safe dataset on Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Build and validate the dataset
        run: python scripts/build_credentialing_hf_dataset.py --output dist/credentialing-policy-atlas
      - name: Verify generated fixity records
        working-directory: dist/credentialing-policy-atlas
        run: sha256sum --check MANIFEST.sha256
      - name: Retain the reviewable public-safe package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: credentialing-policy-atlas-public-safe
          path: dist/credentialing-policy-atlas/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish through an explicitly approved secret
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: huggingface-publication
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Set up the locked publication client
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.29'
      - name: Install the locked publication environment
        run: uv sync --python 3.14.6 --group publication --locked
      - name: Rebuild the public-safe package
        run: >-
          uv run --no-sync python scripts/build_credentialing_hf_dataset.py
          --output dist/credentialing-policy-atlas
      - name: Verify generated fixity records
        working-directory: dist/credentialing-policy-atlas
        run: sha256sum --check MANIFEST.sha256
      - name: Publish the bounded package
        env:
          HF_DATASET_ID: ${{ inputs.dataset_id }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import re
          from pathlib import Path

          from huggingface_hub import HfApi

          dataset_id = os.environ["HF_DATASET_ID"]
          if re.fullmatch(r"edithatogo/[A-Za-z0-9._-]+", dataset_id) is None:
              raise ValueError("Dataset ID must remain in the edithatogo namespace")
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          api.create_repo(
              repo_id=dataset_id,
              repo_type="dataset",
              private=False,
              exist_ok=True,
          )
          result = api.upload_folder(
              repo_id=dataset_id,
              repo_type="dataset",
              folder_path=Path("dist/credentialing-policy-atlas"),
              commit_message="Publish credentialing Policy Atlas public metadata",
          )
          print(result)
          PY
