name: Credentialing Policy Atlas Hugging Face publication

on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Hugging Face dataset repository, for example edithatogo/credentialing-policy-atlas
        required: true
        default: edithatogo/credentialing-policy-atlas
        type: string
      publish:
        description: Publish after building and validating the public-safe package
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: credentialing-hf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build public-safe dataset on Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Build and validate the dataset
        run: python scripts/build_credentialing_hf_dataset.py --output dist/credentialing-policy-atlas
      - name: Display the bounded manifest
        run: cat dist/credentialing-policy-atlas/MANIFEST.sha256

  publish:
    name: Publish through an explicitly approved secret
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: huggingface-publication
    steps:
      - name: Check out without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install the pinned Hub client
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.30.0"
      - name: Rebuild and publish the same public-safe package
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          python scripts/build_credentialing_hf_dataset.py
          --output dist/credentialing-policy-atlas
          --publish
          --dataset-id "${{ inputs.dataset_id }}"
          --token "$HF_TOKEN"
