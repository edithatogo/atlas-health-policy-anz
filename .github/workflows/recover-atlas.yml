name: Recover Atlas onto PR branch

on:
  push:
    branches: [fix/complete-atlas-import]
    paths: [.atlas-import/READY]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-verified-import
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/fix/complete-atlas-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: fix/complete-atlas-import
      - name: Test transport rejection and immutable identity checks
        run: python3 -B -m unittest discover -s .atlas-import -p test_recover.py -v
      - name: Restore exact source, preserve both histories, and validate context
        run: python3 -B .atlas-import/recover.py --restore
      - name: Fast-forward only this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          expected = 'fix/complete-atlas-import'
          branch = subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip()
          if branch != expected or os.environ['GITHUB_REPOSITORY'] != 'edithatogo/atlas-health-policy-anz':
              raise SystemExit('Unexpected repository or branch; refusing push')
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          print('::add-mask::' + auth, flush=True)
          env = dict(os.environ, GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1',
                     GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',
                     GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + expected], env=env, check=True)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        if: always()
        with:
          name: atlas-import-receipt
          path: .atlas-import/import-receipt.json
          if-no-files-found: warn
          retention-days: 30
