name: Bounded strict remediation

on:
  push:
    branches: [feat/nz-authority-registry]
    paths: [.github/workflows/strict-remediation.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-strict-remediation
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/feat/nz-authority-registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install locked runtime and all declared analysis dependencies
        run: |
          uv python install 3.14.6
          uv sync --python 3.14.6 --group dev --group publication --extra nlp --locked
      - name: Package only tracked public source and installed development tools
        run: |
          mkdir -p build/remediation
          git archive --format=tar HEAD | gzip -n > build/remediation/source.tar.gz
          git rev-parse HEAD > build/remediation/source-commit.txt
          uv run --no-sync python - <<'PY'
          import json,sys,sysconfig,tarfile
          from pathlib import Path
          out=Path('build/remediation')
          purelib=Path(sysconfig.get_path('purelib'))
          runtime=Path(sys.base_prefix)
          with tarfile.open(out/'toolchain.tar.gz','w:gz',compresslevel=3) as tf:
              tf.add(runtime,arcname='python',filter=lambda info: None if '__pycache__' in info.name else info)
              tf.add(purelib,arcname='site-packages',filter=lambda info: None if '__pycache__' in info.name else info)
              for name in ('ruff','ty'):
                  tool=Path(sys.executable).parent/name
                  tf.add(tool,arcname='bin/'+name)
          (out/'environment.json').write_text(json.dumps({'python':sys.version,'purpose':'temporary offline strict remediation','contains':'tracked public source and installed runtime/tools only','credentials_included':False},indent=2)+'\n')
          PY
          sha256sum build/remediation/* > build/remediation/checksums.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atlas-locked-remediation-snapshot
          path: build/remediation/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
