name: Apply verified strict remediation

on:
  push:
    branches: [fix/strict-type-quality]
    paths: [.strict-repair/READY]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-verified-strict-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Verify reviewed patch and require unchanged quality gates
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/fix/strict-type-quality'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write # Bounded, test-gated edits on this PR branch only; removed after import.
    steps:
      - name: Check out the repair branch without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: fix/strict-type-quality
      - name: Install the pinned uv runtime manager
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Synchronize the unchanged locked production and test dependencies
        run: |
          uv python install 3.14.6
          uv sync --python 3.14.6 --group dev --group publication --extra nlp --locked
      - name: Verify transport identities and apply the exact reviewed patch
        run: uv run --no-sync python .strict-repair/apply.py apply
      - name: Require Ruff, formatting and both strict type checkers
        run: |
          uv run --no-sync python scripts/strict_quality.py ruff
          uv run --no-sync python scripts/strict_quality.py format
          uv run --no-sync python scripts/strict_quality.py basedpyright
          uv run --no-sync python scripts/strict_quality.py ty
      - name: Require the full coverage suite and independent parallel repeat
        run: |
          uv run --no-sync python scripts/test_goblin.py coverage
          uv run --no-sync python scripts/test_goblin.py parallel
      - name: Require benchmark, context and whitespace checks
        run: |
          uv run --no-sync python scripts/test_goblin.py benchmark
          uv run --no-sync python scripts/benchmark_modality.py
          uv run --no-sync python scripts/validate_context.py
          git diff --cached --check
      - name: Commit only the test-qualified source changes on the repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python .strict-repair/apply.py commit
      - name: Retain exact checker and test receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: strict-repair-qualification
          path: |
            build/quality/
            coverage.json
            quality/strict-remediation-hosted.json
          if-no-files-found: warn
          retention-days: 7
