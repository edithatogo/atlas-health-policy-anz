name: Bronze Publication

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Path to qualified Bronze manifest
        required: true
        default: build/bronze/manifest.json
      dataset_id:
        description: Public Hugging Face dataset ID
        required: true
        default: edithatogo/au-health-policy-atlas-bronze

permissions:
  contents: read

concurrency:
  group: bronze-publication-${{ inputs.dataset_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv python install 3.14.6
      - name: Build exact publication candidate
        env:
          PYTHONPATH: src
        run: >-
          uv run --isolated --no-project --python 3.14.6 python
          scripts/build_hf_candidate.py
          "${{ inputs.manifest }}"
          --output-dir build/hf-candidate
          --dataset-id "${{ inputs.dataset_id }}"
      - name: Publish and remotely verify
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: src
        run: >-
          uv run --isolated --no-project --python 3.14.6
          --with "huggingface_hub>=0.28,<2"
          python scripts/publish_hf.py
          build/hf-candidate
          --repo-id "${{ inputs.dataset_id }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: bronze-publication-receipts
          path: build/hf-candidate/
          if-no-files-found: error
          retention-days: 90
