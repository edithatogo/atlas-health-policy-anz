name: Normalize strict source with test verification
on:
  push:
    branches: [feat/nz-authority-registry]
    paths: [quality/STRICT_NORMALIZATION]
permissions:
  contents: read
concurrency:
  group: strict-source-normalization
  cancel-in-progress: false
jobs:
  normalize:
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/feat/nz-authority-registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # One-off, tested Python normalization on this PR branch only.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install the exact locked environment
        run: |
          uv python install 3.14.6
          uv sync --python 3.14.6 --all-groups --all-extras --locked
      - name: Repair observed resource ownership and coverage paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit('Unexpected patch target: ' + path)
              file.write_text(text.replace(old, new))
          for path, expected in {
              'src/australian_health_policy_atlas/capture.py': '3a752b7d2808c99fbcf8a02f4ac92bd5293edda8',
              'src/australian_health_policy_atlas/crawl.py': 'c0e2bd1fa9f1e941a81ecabada9da1f0c0c501c8',
          }.items():
              if subprocess.check_output(['git', 'hash-object', path], text=True).strip() != expected:
                  raise SystemExit('Observed source changed before repair: ' + path)
          replace_exact('src/australian_health_policy_atlas/capture.py',
              '            last_error = exc\n',
              '            if isinstance(exc, HTTPError):\n                exc.close()\n            last_error = exc\n')
          replace_exact('src/australian_health_policy_atlas/crawl.py',
              '        except HTTPError as exc:\n',
              '        except HTTPError as exc:\n            exc.close()\n')
          replace_exact('tests/integration/test_quality_contract.py',
              '    with pytest.raises(SocketBlockedError):\n        socket.socket()\n',
              '    with (\n        pytest.warns(UserWarning, match=r"A test tried to use socket\\.socket"),\n        pytest.raises(SocketBlockedError),\n    ):\n        socket.socket()\n')
          replace_exact('pyproject.toml', '[tool.coverage.report]\n',
              '[tool.coverage.paths]\natlas = ["src/australian_health_policy_atlas", "*.pyz/australian_health_policy_atlas", "*/*.pyz/australian_health_policy_atlas", "*/src/australian_health_policy_atlas"]\n\n[tool.coverage.report]\n')
          PY
      - name: Apply only Ruff safe fixes and formatting, retaining unresolved findings
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import subprocess
          Path('build/quality').mkdir(parents=True, exist_ok=True)
          result = subprocess.run(['ruff', 'check', '--fix', '--no-unsafe-fixes', '--output-format=json', 'src', 'scripts', 'tests'], capture_output=True, text=True, timeout=120)
          Path('build/quality/safe-fix.stdout').write_text(result.stdout)
          Path('build/quality/safe-fix.stderr').write_text(result.stderr)
          if result.returncode not in (0, 1):
              raise SystemExit(result.returncode)
          print('Safe-fix return code:', result.returncode, '(1 means lint debt remains, not qualification)')
          subprocess.run(['ruff', 'format', 'src', 'scripts', 'tests'], check=True, timeout=120)
          subprocess.run(['ruff', 'format', '--check', 'src', 'scripts', 'tests'], check=True, timeout=120)
          PY
      - name: Verify the full strict suite, coverage and context after edits
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run --no-sync python scripts/test_goblin.py coverage
          uv run --no-sync python scripts/test_goblin.py parallel
          uv run --no-sync python scripts/test_goblin.py benchmark
          uv run --no-sync python scripts/validate_context.py
          uv build
      - name: Record remaining strict diagnostics without suppressing the blocking workflows
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from collections import Counter
          outcomes = {}
          for name, command in {
              'ruff': ['ruff', 'check', '--output-format=json', 'src', 'scripts', 'tests'],
              'basedpyright': ['basedpyright', '--outputjson'],
              'ty': ['ty', 'check', '--output-format=concise', 'src', 'scripts', 'tests'],
          }.items():
              result = subprocess.run(command, capture_output=True, text=True, timeout=300)
              if result.returncode not in (0, 1):
                  raise SystemExit('Tool invocation failed: ' + name + '\n' + result.stderr)
              pathlib.Path('build/quality/' + name + '-normalization.stdout').write_text(result.stdout)
              entry = {'returncode': result.returncode, 'status': 'passed' if result.returncode == 0 else 'failed'}
              if name == 'ruff':
                  findings = json.loads(result.stdout)
                  entry.update(diagnostics=len(findings), by_rule=dict(Counter(row['code'] for row in findings)))
              elif name == 'basedpyright':
                  findings = json.loads(result.stdout)
                  entry.update(summary=findings['summary'], by_rule=dict(Counter(row.get('rule', 'unclassified') for row in findings['generalDiagnostics'])))
              else:
                  entry['summary'] = result.stdout[-300:]
              outcomes[name] = entry
          receipt = {'kind': 'safe-normalization-and-observed-debt-not-a-baseline', 'source_commit': os.environ['GITHUB_SHA'], 'lock_sha256': hashlib.sha256(pathlib.Path('uv.lock').read_bytes()).hexdigest(), 'pyproject_sha256': hashlib.sha256(pathlib.Path('pyproject.toml').read_bytes()).hexdigest(), 'unsafe_fixes': False, 'full_test_suite': 'passed', 'parallel_suite': 'passed', 'benchmark_assertions': 'passed', 'coverage': json.loads(pathlib.Path('coverage.json').read_text())['totals'], 'static_checks': outcomes, 'all_strict_checks_passed': all(v['returncode'] == 0 for v in outcomes.values()), 'suppression_baseline_created': False}
          pathlib.Path('quality/normalization-result.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Commit only scoped, tested changes without force or changing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          branch = 'feat/nz-authority-registry'
          if os.environ['GITHUB_REPOSITORY'] != 'edithatogo/atlas-health-policy-anz' or os.environ['GITHUB_REF'] != 'refs/heads/' + branch:
              raise SystemExit('Wrong destination')
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in changed:
              if path != 'pyproject.toml' and not (path.endswith('.py') and path.startswith(('src/', 'scripts/', 'tests/'))):
                  raise SystemExit('Unapproved normalization path: ' + path)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *changed, 'quality/normalization-result.json'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'commit', '-m', 'refactor: apply safe strict formatting and close leaked HTTP responses'], check=True)
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          print('::add-mask::' + auth, flush=True)
          env = dict(os.environ, GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], env=env, check=True)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: strict-normalization-evidence
          path: |
            build/quality/
            coverage.json
            quality/normalization-result.json
          if-no-files-found: warn
          retention-days: 30
