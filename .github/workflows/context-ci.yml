name: Context CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  context:
    name: Validate Conductor and source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install exact Python runtime
        run: uv python install 3.14.6
      - name: Validate governed context and contracts
        run: uv run --isolated --no-project --python 3.14.6 python scripts/validate_context.py
