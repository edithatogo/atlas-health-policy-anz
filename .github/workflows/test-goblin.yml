name: Test-Goblin
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-goblin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python 3.14 / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, integration, smoke, property, contract, parallel]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install exact runtime
        run: uv python install 3.14.6
      - name: Synchronize locked test environment and optional adapters
        run: uv sync --python 3.14.6 --group test-goblin --group publication --extra nlp --locked
      - name: Check optional dependencies
        run: uv run --no-sync python -c "import huggingface_hub, spacy; print('HF and spaCy adapters available')"
      - name: Run isolated lane without shell template expansion
        env:
          ATLAS_TEST_LANE: ${{ matrix.lane }}
        run: uv run --no-sync python scripts/test_goblin.py "$ATLAS_TEST_LANE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pytest-${{ matrix.lane }}-receipt
          path: build/quality/
          if-no-files-found: warn
          retention-days: 30
  coverage-and-benchmarks:
    name: Coverage, benchmark and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install exact runtime
        run: uv python install 3.14.6
      - name: Synchronize locked development environment and optional adapters
        run: uv sync --python 3.14.6 --group dev --group publication --extra nlp --locked
      - name: Test with strict warnings and subprocess-aware branch coverage
        env:
          COVERAGE_CORE: sysmon
        run: uv run --no-sync python scripts/test_goblin.py coverage
      - name: Run deterministic modality benchmark
        run: uv run --no-sync python scripts/benchmark_modality.py
      - name: Validate Conductor context
        run: uv run --no-sync python scripts/validate_context.py
      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: atlas-quality-receipts
          path: |
            build/benchmarks/
            build/quality/
            coverage.xml
            coverage.json
            dist/
          if-no-files-found: warn
          retention-days: 30
