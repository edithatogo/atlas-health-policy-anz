name: Resolve strict test toolchain lock
on:
  push:
    branches: [feat/nz-authority-registry]
    paths: [quality/STRICT_LOCK_REFRESH]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strict-toolchain-lock-refresh
  cancel-in-progress: false
jobs:
  lock:
    if: github.repository == 'edithatogo/atlas-health-policy-anz' && github.ref == 'refs/heads/feat/nz-authority-registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Commit only the resolved lock and installed-tool identity receipt to this branch.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Resolve and install the genuine complete toolchain
        run: |
          uv python install 3.14.6
          uv lock
          uv sync --python 3.14.6 --all-groups --all-extras --locked
      - name: Record exact installed versions and lock identity
        run: |
          uv run --no-sync python - <<'PY'
          from importlib import metadata
          import hashlib, json, os, pathlib, sys
          names = ['pytest', 'coverage', 'hypothesis', 'pytest-cov', 'pytest-timeout', 'pytest-xdist', 'pytest-randomly', 'pytest-mock', 'pytest-socket', 'pytest-subprocess', 'pytest-httpserver', 'inline-snapshot', 'pytest-benchmark', 'pytest-gremlins', 'mutmut', 'pytest-testmon', 'pytest-picked', 'ruff', 'basedpyright', 'ty', 'types-jsonschema']
          receipt = {'kind': 'resolved-test-toolchain-not-qualification', 'source_commit': os.environ['GITHUB_SHA'], 'python': sys.version, 'versions': {name: metadata.version(name) for name in names}, 'lock_sha256': hashlib.sha256(pathlib.Path('uv.lock').read_bytes()).hexdigest(), 'pyproject_sha256': hashlib.sha256(pathlib.Path('pyproject.toml').read_bytes()).hexdigest(), 'pytest_entry_points': {ep.name: ep.value for ep in metadata.entry_points(group='pytest11')}}
          pathlib.Path('quality/resolved-test-tools.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Commit only the two allowed files; never force or change main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          branch = 'feat/nz-authority-registry'
          if os.environ['GITHUB_REPOSITORY'] != 'edithatogo/atlas-health-policy-anz' or os.environ['GITHUB_REF'] != 'refs/heads/' + branch:
              raise SystemExit('Unexpected destination')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', 'uv.lock', 'quality/resolved-test-tools.json'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:
              raise SystemExit(0)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'commit', '-m', 'build: resolve and record the strict test toolchain'], check=True)
          auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          print('::add-mask::' + auth, flush=True)
          env = dict(os.environ, GIT_TERMINAL_PROMPT='0', GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], env=env, check=True)
          PY
