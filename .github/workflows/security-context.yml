name: Security and Context
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  leak-detection:
    name: Scan complete Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_ASSET: gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error --output "$GITLEAKS_ASSET" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ASSET}"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_ASSET}" | sha256sum --check
          tar --extract --gzip --file "$GITLEAKS_ASSET" gitleaks
      - name: Scan without suppressing findings
        run: mkdir -p build && ./gitleaks git --redact --no-banner --report-format json --report-path build/gitleaks.json .
      - name: Report finding coordinates only, never secret values
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/gitleaks.json')
          if path.is_file():
              for finding in json.loads(path.read_text()):
                  print(json.dumps({k: finding.get(k) for k in ('RuleID', 'File', 'StartLine', 'EndLine', 'Commit', 'Fingerprint')}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: gitleaks-history-report
          path: build/gitleaks.json
          if-no-files-found: warn
          retention-days: 30
  workflow-security:
    name: Lint and audit workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install and run actionlint
        env:
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" actionlint
          ./actionlint
      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from zizmor==1.13.0 zizmor --pedantic .github
  supply-chain:
    name: Audit resolved dependencies and generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Require and check committed dependency lock
        run: |
          test -f uv.lock
          uv python install 3.14.6
          uv lock --check
      - name: Install complete audited environment
        run: uv sync --python 3.14.6 --all-groups --all-extras --locked
      - name: Export hashed lock requirements
        run: |
          mkdir -p build
          uv export --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file build/audit-requirements.txt
      - name: Audit the lock, not an empty bootstrap environment
        run: uv run --no-sync pip-audit --require-hashes --no-deps --disable-pip -r build/audit-requirements.txt --format json --output build/pip-audit.json
      - name: Generate SBOM even when the vulnerability audit fails
        if: success() || failure()
        run: uv run --no-sync cyclonedx-py environment --output-file build/sbom.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: supply-chain-receipt
          path: |
            build/sbom.cdx.json
            build/pip-audit.json
            build/audit-requirements.txt
          if-no-files-found: warn
          retention-days: 30
  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload CodeQL SARIF to this repository's code-scanning service.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
