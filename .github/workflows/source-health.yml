name: Source Health
on:
  schedule:
    - cron: "23 17 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-health-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portal-capture:
    name: Check source portal availability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
      - name: Install exact runtime
        run: uv python install 3.14.6
      - name: Capture seed portals without promoting a release
        env:
          PYTHONPATH: src
        run: >-
          uv run --isolated --no-project --python 3.14.6 python
          scripts/capture_registry_portals.py --continue-on-error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: source-health-receipts
          path: build/portal-capture/
          if-no-files-found: error
          retention-days: 30
