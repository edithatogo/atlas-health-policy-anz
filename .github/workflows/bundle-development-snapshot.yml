name: Temporary bundle development snapshot
on:
  push:
    branches: [feat/bronze-capture-bundles]
    paths: [.github/workflows/bundle-development-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'edithatogo/atlas-health-policy-anz'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Export only locked native checker binaries
        run: |
          uv python install 3.14.6
          uv sync --python 3.14.6 --group dev --group publication --extra nlp --locked
          mkdir -p "$RUNNER_TEMP/export"
          tar -czf "$RUNNER_TEMP/export/checkers.tar.gz" -C .venv/bin ruff ty
          sha256sum pyproject.toml uv.lock > "$RUNNER_TEMP/export/contracts.sha256"
          cd "$RUNNER_TEMP/export"
          sha256sum checkers.tar.gz contracts.sha256 > SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bundle-native-checkers
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
