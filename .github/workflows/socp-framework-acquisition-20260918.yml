name: SoCP framework public evidence acquisition
on:
  pull_request:
    paths:
      - '.github/workflows/socp-framework-acquisition-20260918.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: socp-framework-public-acquisition-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Acquire public sources and portable review tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/socp-evidence/{bronze,tooling}
          python -m pip install --quiet --target /tmp/socp-evidence/tooling/site-packages textstat pyphen beautifulsoup4 pymupdf jsonschema
          PYTHONPATH=/tmp/socp-evidence/tooling/site-packages python - <<'PY'
          import concurrent.futures, hashlib, json, re, subprocess, sys, time, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup
          root=Path('/tmp/socp-evidence'); bronze=root/'bronze'
          allowed={'www.schn.health.nsw.gov.au','www.safetyandquality.gov.au','www.health.qld.gov.au','metronorth.health.qld.gov.au','www.metronorth.health.qld.gov.au'}
          pages={
            'schn-medical':'https://www.schn.health.nsw.gov.au/nsw-state-scope-clinical-practice-unit/model-scopes-surgical-and-medical',
            'schn-paediatric':'https://www.schn.health.nsw.gov.au/nsw-state-scope-clinical-practice-unit/model-scopes-paediatric',
            'schn-dental':'https://www.schn.health.nsw.gov.au/nsw-state-scope-clinical-practice-unit/model-scopes-dental',
            'schn-development':'https://www.schn.health.nsw.gov.au/nsw-state-scope-clinical-practice-unit',
            'schn-consultation':'https://www.schn.health.nsw.gov.au/nsw-state-scope-clinical-practice-unit/model-scopes-consultation',
            'schn-ecredential':'https://www.schn.health.nsw.gov.au/nsw-state-scope-clinical-practice-unit/ecredential',
            'national-guidance':'https://www.safetyandquality.gov.au/resources/credentialing-and-defining-scope-practice-guidance-health-services-and-clinicians',
            'qh-hsd-034':'https://www.health.qld.gov.au/system-governance/policies-standards/health-service-directives/credentialing-and-defining-the-scope-of-clinical-practice',
            'metro-north-credentialing':'https://metronorth.health.qld.gov.au/careers/medical-officer-credentialing'
          }
          records=[]; candidates={}; memberships=[]
          def read(url):
              if urllib.parse.urlsplit(url).hostname not in allowed: raise ValueError('host not allowed')
              req=urllib.request.Request(url,headers={'User-Agent':'PolicyAtlas-SourceReview/1.0','Accept':'text/html,application/pdf,*/*'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  if urllib.parse.urlsplit(response.url).hostname not in allowed: raise ValueError('redirect host not allowed')
                  data=response.read(20000001)
                  if len(data)>20000000: raise ValueError('response exceeds limit')
                  return data,response.url,response.headers.get('Content-Type','')
          for source_id,url in pages.items():
              rec={'id':source_id,'url':url,'observed_at':datetime.now(timezone.utc).isoformat(),'status':'failed'}
              try:
                  data,final_url,content_type=read(url)
                  if 'html' not in content_type: raise ValueError('expected HTML')
                  path=bronze/(source_id+'.html');path.write_bytes(data)
                  rec.update(status='preserved',path=str(path.relative_to(root)),sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),resolved_url=final_url)
                  soup=BeautifulSoup(data,'html.parser'); main=soup.find('main') or soup
                  for link in main.find_all('a',href=True):
                      target=urllib.parse.urljoin(final_url,link['href']); parsed=urllib.parse.urlsplit(target)
                      if parsed.hostname not in allowed or not parsed.path.lower().endswith(('.pdf','.docx')): continue
                      label=link.get_text(' ',strip=True); text=(label+' '+urllib.parse.unquote(parsed.path)).lower()
                      if source_id.startswith('schn-') and not any(t in text for t in ('socp','scope','credential','principle')): continue
                      if source_id=='national-guidance' and not any(t in text for t in ('credential','scope')): continue
                      if source_id.startswith('qh-') and not any(t in text for t in ('credential','scope','390','034')): continue
                      if source_id.startswith('metro-') and not any(t in text for t in ('socp','scope','credential','memo')): continue
                      candidates.setdefault(target,{'url':target,'label':label,'listing':source_id})
                      memberships.append({'listing':source_id,'label':label,'document_url':target})
              except Exception as exc: rec['error']=type(exc).__name__+': '+str(exc)[:250]
              records.append(rec)
          def download(item):
              url=item['url']; name=urllib.parse.unquote(urllib.parse.urlsplit(url).path.rsplit('/',1)[-1]); safe=re.sub(r'[^a-zA-Z0-9._-]+','-',name)
              ident=hashlib.sha256(url.encode()).hexdigest()[:12]; rec={**item,'id':'web-'+ident,'observed_at':datetime.now(timezone.utc).isoformat(),'status':'failed'}
              try:
                  data,final_url,ct=read(url)
                  if url.lower().split('?')[0].endswith('.pdf') and not data.startswith(b'%PDF-'): raise ValueError('not PDF bytes')
                  if url.lower().split('?')[0].endswith('.docx') and not data.startswith(b'PK'): raise ValueError('not DOCX bytes')
                  path=bronze/(ident+'-'+safe);path.write_bytes(data)
                  rec.update(status='preserved',path=str(path.relative_to(root)),sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),resolved_url=final_url,content_type=ct)
              except Exception as exc: rec['error']=type(exc).__name__+': '+str(exc)[:250]
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool: records.extend(pool.map(download,list(candidates.values())[:180]))
          (root/'acquisition.json').write_text(json.dumps({'observed_at':datetime.now(timezone.utc).isoformat(),'records':records,'memberships':memberships,'max_downloads':180,'rights':'Source copyrights retained; review copies, not relicensed or approved local instruments.'},indent=2))
          for repo in ('authentext','sourceright'):
              dest=root/'tooling'/repo
              result=subprocess.run(['git','clone','--depth','1','https://github.com/edithatogo/'+repo+'.git',str(dest)],capture_output=True,text=True)
              if result.returncode==0:
                  head=subprocess.check_output(['git','-C',str(dest),'rev-parse','HEAD'],text=True).strip()
                  (root/'tooling'/(repo+'-commit.txt')).write_text(head+'\n')
          python_url='https://github.com/astral-sh/python-build-standalone/releases/download/20260203/cpython-3.14.3%2B20260203-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          try: urllib.request.urlretrieve(python_url,root/'tooling/python314.tar.gz')
          except Exception as exc: (root/'tooling/python-download-error.txt').write_text(str(exc))
          try:
              request=urllib.request.Request('https://api.github.com/repos/edithatogo/sourceright/releases/latest',headers={'User-Agent':'PolicyAtlas-SourceReview/1.0'})
              release=json.load(urllib.request.urlopen(request,timeout=30))
              (root/'tooling/sourceright-release.json').write_text(json.dumps(release,indent=2))
              for asset in release.get('assets',[]):
                  name=asset['name'].lower()
                  if ('linux' in name or 'unknown-linux' in name) and ('x86_64' in name or 'amd64' in name) and name.endswith(('.tar.gz','.zip')):
                      urllib.request.urlretrieve(asset['browser_download_url'],root/'tooling'/asset['name']); break
          except Exception as exc: (root/'tooling/sourceright-download-error.txt').write_text(str(exc))
          (root/'tooling/runtime.json').write_text(json.dumps({'python':sys.version,'purpose':'Public-source acquisition only; no CHHHS or personal source content sent to runner.'},indent=2))
          lines=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and '.git' not in path.parts and '__pycache__' not in path.parts:
                  lines.append(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+str(path.relative_to(root)))
          (root/'MANIFEST.sha256').write_text('\n'.join(lines)+'\n')
          print(json.dumps({'preserved':sum(r['status']=='preserved' for r in records),'failed':sum(r['status']=='failed' for r in records),'candidates':len(candidates)},indent=2))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: socp-public-evidence-20260918
          path: /tmp/socp-evidence/
          retention-days: 7
          if-no-files-found: error
